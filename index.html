<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <img src="https://i.pravatar.cc/150" alt="profile">

    <h2>Your Name</h2>
    <p class="role">Frontend Developer</p>

    <p class="desc">
      I am learning HTML and CSS and building clean, responsive web pages.
    </p>

    <div class="skills">
      <span>HTML</span>
      <span>CSS</span>
      <span>Flexbox</span>
    </div>

    <button>Contact Me</button>
  </div>
<script src="script.js"></script>
</body>
</html>
