<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button id="themeToggle" class="theme-btn">🌙</button>

  <div class="card">

    <img src="https://i.pravatar.cc/150" alt="profile" class="profile-img">

    <h2>Frontend Lab</h2>

    <p class="role">
      <span id="typing"></span>
    </p>

    <p class="desc">
      Building modern, responsive and interactive web interfaces using HTML, CSS & JavaScript.
    </p>

    <div class="skills" id="skills"></div>

    <button id="contactBtn">Contact Me</button>
  </div>

  <!-- Contact Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h3>Contact Me</h3>
      <input type="text" id="name" placeholder="Your Name">
      <input type="text" id="message" placeholder="Your Message">
      <button id="sendBtn">Send</button>
      <button id="closeBtn">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
